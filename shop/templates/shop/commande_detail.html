{% extends 'shop/base.html' %}
{% block content %}
<div class="max-w-3xl mx-auto mt-25 bg-white p-8 rounded-lg shadow-lg">
  <h2 class="text-3xl font-bold mb-6 text-center text-orange-600">Détails de la commande</h2>

  <div class="flex flex-col md:flex-row items-center md:space-x-6">
    <img src="{{ meuble.image.url }}" alt="{{ meuble.nom }}" class="w-full md:w-1/2 rounded-lg mb-6 md:mb-0">
    <div>
      <h3 class="text-2xl font-semibold">{{ meuble.nom }}</h3>
      <p class="text-gray-700 mt-2 mb-4">{{ meuble.description }}</p>
      <p class="text-orange-600 text-xl font-bold mb-6">{{ meuble.prix }} FCFA</p>
      <button class="bg-orange-600 hover:bg-orange-700 text-white px-6 py-3 rounded-lg">Confirmer la commande</button>
    </div>
  </div>
</div>
{% endblock %}
